# Release — advisor-harness (npm)
#
# No duplica la definición de CI: el job `ci` llama al workflow reutilizable
# ./.github/workflows/ci.yml (`workflow_call` en ese archivo) y `publish` solo
# arranca si todo lo de CI pasó. Así hay UNA sola definición de los jobs.
#
# Disparo: tag `v<version>` (el patrón con el que se publica en npm) o manual
# con `--dry-run` para verificar sin publicar nada.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Verificar sin publicar ni crear release (solo el job ci + comprobaciones)'
        type: boolean
        required: false
        default: true

# Un release por tag. NO se cancela en curso (`cancel-in-progress: false`):
# cortar un publish a medias deja el tag y npm en un estado que nadie ha
# verificado. El prefijo es LITERAL (`release-`) y distinto del de ci.yml
# (`ci-`): en un `workflow_call`, `github.workflow` NO cambia (se resuelve al
# nombre del caller en ambos), así que no sirve para desambiguar grupos —
# con la expresión antigua (`github.workflow-ref`, idéntica en ambos ficheros)
# el callee caía en el grupo del caller y se auto-bloqueaba (deadlock del run
# 39629128099).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Por defecto, solo lectura. El job `publish` sube sus permisos a lo mínimo que
# necesita (abajo se explica cuál es cuál).
permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Gate: la CI completa (5 jobs, matriz incluida) sobre el MISMO commit.
  # ───────────────────────────────────────────────────────────────────────────
  ci:
    name: ci (gate)
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ───────────────────────────────────────────────────────────────────────────
  # Publicación + release de GitHub con el tarball adjunto.
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: publish
    needs: ci
    # El job SIEMPRE corre: en dry-run ejecuta la verificación (tag + validaciones
    # + empaquetado) y se salta únicamente los dos pasos con efecto externo
    # (publicar y crear la release).
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` — crear el GitHub Release (releases: write no hace
      # falta; el permiso de contents cubre el release del tag).
      # `id-token: write` — OIDC: npm Trusted Publishing autentica el publish con
      # él (sin token) y firma la provenance. Sin esto no hay publish posible.
      contents: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      # Historial completo: la guarda de abajo comprueba ancestría con
      # `git merge-base --is-ancestor`, que necesita los objetos del commit del
      # tag y de `origin/main` (un checkout shallow no los trae).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # SIN `registry-url`: setup-node escribiría un .npmrc con
          # `_authToken=${NODE_AUTH_TOKEN}`, y un token vacío rompe el OIDC de
          # Trusted Publishing (actions/setup-node#1551). npm ya usa
          # registry.npmjs.org por defecto.
          cache: ''

      # Igual que en CI: la opencode.json de la raíz está gitignored y sin ella
      # `npm test` falla en test/doctor.test.mjs (doctor ya no tiene fallback a la
      # plantilla). La genera `npm run dev:config` — misma forma de invocación que
      # en ci.yml. Fichero de trabajo, no se commitea.
      - name: generar la opencode.json de la raíz (config de desarrollo)
        run: npm run dev:config

      # El tag es la versión: si divergen, se publica algo distinto de lo que
      # dice el tag, y eso no se detecta en npm hasta que es tarde. Solo aplica
      # al disparo por tag: en workflow_dispatch no hay tag que contrastar.
      - name: el tag coincide con la versión de package.json
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "::error::el tag ${{ github.ref_name }} no corresponde a package.json v$version"
            exit 1
          fi
          echo "tag ${{ github.ref_name }} == package.json v$version"

      # El publish se origina desde `main` (rama estable): un tag fuera de `main`
      # no es un release publicable. Solo aplica al disparo por tag (en
      # workflow_dispatch no hay tag que situar).
      - name: el tag está sobre main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::el tag ${{ github.ref_name }} no está sobre main"; exit 1; }
          echo "tag ${{ github.ref_name }} ($GITHUB_SHA) es ancestro de origin/main"

      # Las mismas validaciones que en el paso de release de la CI, por si este
      # workflow se lanza solo (workflow_dispatch).
      - name: version coherente
        run: npm run version:check

      - name: contract tests
        run: npm run test:contract

      - name: npm test
        run: npm test

      - name: npm pack
        id: pack
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent | tail -n 1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "empaquetado: $tarball"

      # Idempotencia del release: si `advisor-harness@<version>` YA está en npm,
      # el publish se salta (re-ejecutar un tag ya publicado no es un fallo). Solo
      # el E404 de `npm view` significa "no existe": cualquier otro error (red,
      # 5xx, ENEEDAUTH) es un fallo REAL y NO puede degradar a skip, o el workflow
      # diría "ya estaba" mientras el paquete sigue sin publicarse.
      - name: comprobar si advisor-harness@<version> ya está publicado
        id: published
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          set +e
          salida=$(npm view "advisor-harness@$version" version 2>&1)
          estado=$?
          set -e
          if [ "$estado" -eq 0 ]; then
            echo "ya=true" >> "$GITHUB_OUTPUT"
            echo "::notice::advisor-harness@$version ya existe en npm: se omite el publish"
            echo "ya publicado: $salida"
          elif printf '%s' "$salida" | grep -q 'E404'; then
            echo "ya=false" >> "$GITHUB_OUTPUT"
            echo "advisor-harness@$version no existe todavía: se publicará"
          else
            echo "::error::npm view falló (exit $estado) y no es E404: no se puede decidir si publicar — $salida"
            exit 1
          fi

      # Trusted Publishing (OIDC) exige npm CLI >= 11.5.1; Node 20 trae npm 10.x,
      # que falla con un 404 engañoso. Se actualiza solo npm, no el Node de la suite.
      - name: npm >= 11.5.1 (Trusted Publishing)
        if: (github.event_name == 'push' || !inputs.dry-run) && steps.published.outputs.ya != 'true'
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # npm publish vía Trusted Publishing (OIDC): sin NPM_TOKEN ni secretos; npm
      # canjea el id-token del job (publisher configurado en npmjs.com para este
      # repo + release.yml). --provenance ata el tarball al workflow y al commit.
      # En dry-run (workflow_dispatch con la casilla marcada) este paso no corre, y
      # tampoco si la versión ya estaba publicada (paso anterior).
      - name: publicar en npm (con provenance)
        if: (github.event_name == 'push' || !inputs.dry-run) && steps.published.outputs.ya != 'true'
        run: |
          set -euo pipefail
          npm publish "${{ steps.pack.outputs.tarball }}" \
            --provenance \
            --access public \
            --registry=https://registry.npmjs.org
          echo "publicado advisor-harness@${{ github.ref_name }}"

      # Aserción post-publish: que lo que se ve en el registry sea exactamente lo
      # que se acaba de publicar. `latest` NO es decorativo — en 1.0.0 apuntaba al
      # stub `0.0.0-stage` y `npx advisor-harness@latest` servía el paquete
      # equivocado sin que nada fallara.
      - name: verificar en el registry (versión + dist-tag latest)
        if: (github.event_name == 'push' || !inputs.dry-run) && steps.published.outputs.ya != 'true'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          publicado=$(npm view "advisor-harness@$version" version)
          if [ "$publicado" != "$version" ]; then
            echo "::error::el registry devuelve '$publicado' para advisor-harness@$version"
            exit 1
          fi
          latest=$(npm view advisor-harness dist-tags.latest)
          if [ "$latest" != "$version" ]; then
            echo "::error::dist-tags.latest apunta a '$latest' y no a la versión publicada ($version); corrige con: npm dist-tag add advisor-harness@$version latest"
            exit 1
          fi
          echo "registry OK: advisor-harness@$version es latest"

      # `gh release view || gh release create`: idempotente a propósito. Si el
      # publish ya existía y la release quedó a medias (publish OK / release KO),
      # una re-ejecución del tag crea la release en vez de fallar por duplicada.
      - name: crear la release de GitHub con el tarball adjunto
        if: github.event_name == 'push' || !inputs.dry-run
        env:
          # El token por defecto de Actions ya viene con permisos de escritura
          # sobre contents; no hace falta un PAT propio.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "la release $tag ya existe: no se recrea"
          else
            gh release create "$tag" \
              --title "advisor-harness $tag" \
              --generate-notes \
              "${{ steps.pack.outputs.tarball }}"
          fi

      - name: borrar el tarball
        if: always()
        run: rm -f "${{ steps.pack.outputs.tarball }}"
